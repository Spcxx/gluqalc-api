services:
  redis:
    image: redis:8.6.1-alpine
    container_name: gluqalc-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - app-net

  db:
    image: postgres:15-alpine
    container_name: gluqalc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gluqalc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  adminer:
    image: adminer
    container_name: gluqalc-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app-net

  api:
    build: .
    container_name: gluqalc-api
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - app-net

volumes:
  redis_data:
  pgdata:

networks:
  app-net:
    driver: bridge