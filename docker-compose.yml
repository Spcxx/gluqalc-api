services:
  redis:
    image: redis:8.6.1-alpine
    container_name: gluqalc-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  api:
    build: .
    container_name: gluqalc-api
    ports:
      - "8080:8080"
    depends_on:
      - redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs

volumes:
  redis_data: