spring:
  application:
    name: GluQalc API
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    root: INFO
    pl.srozga: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
jwt:
  secret: ${JWT_SECRET}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    doc-expansion: list