server:
  forward-headers-strategy: native
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
app:
  security:
    db-encryption:
      key: ${DB_ENCRYPTION_KEY}
  integration:
    open-food-facts:
      url: https://world.openfoodfacts.org
      user-agent: GluQalc/1.0 (rozga.szymon@gmail.com)
  mail:
    from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
    expiration-time-ms: 900000
    refresh-expiration-ms: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  rate-limiter:
    max-requests: 100
    time-window: 15
  session:
    max-devices: 5
spring:
  application:
    name: GluQalc API
  devtools:
    restart:
      enabled: false
  jackson:
    time-zone: UTC
    locale: en_US
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    root: INFO
    pl.srozga: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    doc-expansion: list
    tags-sorter: alpha
    filter: true
    persist-authorization: true