app:
  api-url: http://localhost:8080
  email-from: no-reply@srozga.pl
  jwt:
    secret: ${JWT_SECRET}
    expiration-time-ms: 900000
    refresh-expiration-ms: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  rate-limiter:
    max-requests: 100
    time-window: 60
spring:
  application:
    name: GluQalc API
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    root: INFO
    pl.srozga: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    doc-expansion: list